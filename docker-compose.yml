name: mantine-ui

services:

  web-app:
    image: hubviwe/mantine.ui.web.app:0.0.1
    container_name: mantine-ui-web-app
    hostname: web-app
    build:
      context: src/
      dockerfile: Dockerfile
    develop:
      watch:
        - action: sync
          path: /src
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules